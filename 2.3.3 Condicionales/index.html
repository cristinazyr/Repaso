<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Módulo 2 Lección 03</title>

    <script src="https://kit.fontawesome.com/66349fc88a.js" crossorigin="anonymous"></script>

    <link rel="stylesheet" href="https://beta.adalab.es/resources/stylesheets/all.css">
    <link rel="stylesheet" href="./css/main.css">
</head>

<body class="darkmode">
    <header class="header">
        <h1 class="header__title">2.03 Condicionales</h1>
    </header>
    <main class="main">
        <form class="form">
            <legend class="form__title">Día del año</legend>
            <label class="form__line" for="day">
                Día:
                <input class="js__dayInput" type="number" name="day" id="day" placeholder="Ej: 13">
            </label>
            <label class="form__line" for="month">
                Mes:
                <input class="js__monthInput" type="text" name="month" id="month" placeholder="Ej: Enero">
            </label>

            <button class="js__btn">Combrobar</button>

            <div class="form__result js__result"></div>
        </form>
    </main>

    <script src="./js/main.js"></script>
</body>

</html>
